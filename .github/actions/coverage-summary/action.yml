name: "Simple CI Summary"
description: "Writes a basic GitHub Actions job summary"

runs:
  using: "composite"
  steps:
    - name: Write summary
      shell: bash
      run: |
        {
          echo "## CI Summary"
          echo ""
          echo "- Job summary writing is working ✅"
          echo "- Next step: add coverage data"
        } >> "$GITHUB_STEP_SUMMARY"
