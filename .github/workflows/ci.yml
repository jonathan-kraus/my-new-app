name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - 'renovate/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  build:
    name: Run test and build
    runs-on: ubuntu-latest
    env:
      CI: true
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clean workspace
        run: git clean -fdx

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.4.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          corepack install
          mkdir -p ./.tools
          corepack pnpm --version
          echo "PNPM_CLI=$(pwd)/.tools/pnpm" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          export PATH="$(dirname "$PNPM_CLI"):$PATH"
          corepack pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          export PATH="$(dirname "$PNPM_CLI"):$PATH"
          corepack pnpm exec prisma generate

      - name: Check for outdated dependencies
        run: |
          export PATH="$(dirname "$PNPM_CLI"):$PATH"
          corepack pnpm outdated | grep -v -E '(prisma|@prisma)' || true

      - name: Run tests with coverage
        run: |
          export PATH="$(dirname "$PNPM_CLI"):$PATH"
          corepack pnpm coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true
          verbose: true

      - name: Type check
        run: |
          export PATH="$(dirname "$PNPM_CLI"):$PATH"
          corepack pnpm run type-check

      - name: Run security audit
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ secrets.AXIOM_DATASET }}
          AXIOM_ORG_ID: ${{ secrets.AXIOM_ORG_ID }}
        run: |
          node .github/scripts/audit.js

      - name: Show workspace files for diagnostics
        run: |
          echo "Working directory: $(pwd)"
          echo "List root files:"; ls -la
          echo "Process environment CI: $CI"
          echo "List coverage dir (if present):"; ls -la coverage || true

      - name: Build
        env:
          CI: true
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ secrets.AXIOM_DATASET }}
          AXIOM_ORG_ID: ${{ secrets.AXIOM_ORG_ID }}
        run: |
          export PATH="$(dirname "$PNPM_CLI"):$PATH"
          corepack pnpm build
