name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Audit, lint, test, and build
    runs-on: ubuntu-latest
    env:
      CI: true
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    permissions:
      contents: write   # allow pushing updated version.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clean workspace
        run: git clean -fdx

      - name: Bump UI version (version.json)
        run: |
          if [ ! -f version.json ]; then
            echo '{"version":"0.0.0"}' > version.json
          fi

          VERSION=$(jq -r '.version' version.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          jq --arg v "$NEW_VERSION" '.version = $v' version.json > version.tmp && mv version.tmp version.json
          echo "Bumped UI version: $VERSION -> $NEW_VERSION"

          # Only commit/push on direct pushes to main, not PRs
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version.json
            git commit -m "chore: bump UI version to $NEW_VERSION [skip ci]" || exit 0
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.4.0'

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v3-${{ hashFiles('**/package.json','**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v3-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Check for outdated dependencies
        run: pnpm outdated | grep -v -E '(prisma|@prisma)' || true

      - name: Run tests with coverage
        run: pnpm coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true

      - name: Type check
        run: pnpm run type-check

      - name: Security audit
        if: github.event_name == 'push'
        run: pnpm audit

      - name: Show workspace files for diagnostics
        if: always()
        run: |
          echo "Working directory: $(pwd)"
          echo "List root files:"; ls -la
          echo "List coverage dir (if present):"; ls -la coverage || true

      - name: Build
        env:
          CI: true
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm build
