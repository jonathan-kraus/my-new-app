name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - 'renovate/**'

jobs:
  build:
    name: Run test and build
    runs-on: ubuntu-latest
    env:
      CI: true
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Confirm toolchain
        run: |
          node --version
          pnpm --version
          pnpm store path

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm exec eslint .

      - name: Validate Prisma contract and generated artifacts
        run: |
          pnpm exec prisma format
          pnpm exec prisma contract emit
          git diff --exit-code -- prisma

      - name: Check for outdated dependencies
        run: pnpm outdated | grep -v -E '(prisma|@prisma)' || true

      - name: Coverage
        run: pnpm coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: true

      - name: Type check
        run: pnpm run type-check

      - name: Audit
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ secrets.AXIOM_DATASET }}
          AXIOM_ORG_ID: ${{ secrets.AXIOM_ORG_ID }}
        run: node .github/scripts/audit.js

      - name: Show workspace files for diagnostics
        run: |
          echo "Working directory: $(pwd)"
          echo "List root files:"; ls -la
          echo "Process environment CI: $CI"
          echo "List coverage dir (if present):"; ls -la coverage || true

      - name: Build
        env:
          CI: true
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ secrets.AXIOM_DATASET }}
          AXIOM_ORG_ID: ${{ secrets.AXIOM_ORG_ID }}
        run: pnpm build
