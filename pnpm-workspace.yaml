packages:
  - .

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@hono/node-server@2.0.8'
  - js-yaml@5.2.1
  - tsx@4.22.5
  - vite@8.1.3

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - core-js
  - prisma
  - sharp
  - unrs-resolver
